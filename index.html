<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workout Log</title>
<style>
  :root { --bg:#fafafa; --fg:#1a1a1a; --card:#fff; --mut:#666; --line:#ddd; --acc:#0a6cff; --good:#1a7f37; --bad:#cf222e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111; --fg:#eee; --card:#1b1b1b; --mut:#999; --line:#333; --acc:#5aa2ff; --good:#3fb950; --bad:#ff7b72; }
  }
  body { font:16px system-ui,sans-serif; background:var(--bg); color:var(--fg); max-width:640px; margin:0 auto; padding:16px; }
  h1 { font-size:1.4rem; } h2 { font-size:1.05rem; margin-top:1.5rem; }
  form, li, .tot { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; }
  form { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  label { display:flex; flex-direction:column; font-size:.8rem; color:var(--mut); gap:2px; }
  input, select, button { font:inherit; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  [hidden] { display:none !important; }
  .wide { grid-column:1/-1; }
  button { cursor:pointer; } button.go { background:var(--acc); color:#fff; border-color:var(--acc); }
  ul { list-style:none; padding:0; display:grid; gap:8px; }
  li { display:flex; justify-content:space-between; gap:8px; }
  li small, .mut { color:var(--mut); }
  .del { border:0; background:none; color:var(--mut); }
  .tot { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:8px; }
  table { width:100%; border-collapse:collapse; text-align:right; }
  th, td { padding:6px 4px; border-bottom:1px solid var(--line); }
  th:first-child, td:first-child { text-align:left; }
  .good { color:var(--good); font-weight:600; } .bad { color:var(--bad); font-weight:600; }
  th { font-size:.8rem; color:var(--mut); font-weight:normal; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
</style>
</head>
<body>
<h1>Workout Log</h1>

<form id="lock" hidden>
  <p class="wide mut">Type your password (10+ characters). Use the same one on every device; it keeps your log in sync.</p>
  <input class="wide" id="pw" type="password" minlength="10" required autocomplete="current-password">
  <button class="go wide">Unlock</button>
</form>

<div id="app">
<h2>Weeks</h2>
<table id="weeks"></table>

<h2>Add workout</h2>

<form id="f">
  <label>Date <input name="date" type="date" required></label>
  <label>Type <select name="type" required></select></label>
  <label>Duration (min) <input name="min" type="number" step="any" min="0" required></label>
  <label><span id="dl">Distance</span> <input name="dist" type="number" step="any" min="0"></label>
  <label id="sul" hidden>Swim units <select name="su"></select></label>
  <label>Calories <input name="cal" type="number" min="0"></label>
  <label>Avg HR (bpm) <input name="hr" type="number" min="0"></label>
  <label>Max HR (bpm) <input name="hrmax" type="number" min="0"></label>
  <label>Notes <input name="note"></label>
  <button class="go wide" id="sub">Add workout</button>
  <button type="button" class="wide" id="cancel" hidden>Cancel edit</button>
</form>

<h2>Totals</h2>
<div class="tot" id="tot"></div>

<h2>History</h2>
<ul id="list"></ul>

<div class="row">
  <label class="row">Distance units
    <select id="u"><option value="km">km</option><option value="mi">mi</option></select>
  </label>
  <button id="lockBtn">Lock</button>
</div>
</div>

<script>
// kind: how derived pace/speed is shown. swim distances are entered in metres, everything else in km/mi.
const TYPES = {
  "Outdoor Bike":   { kind: "speed" },
  "Indoor Bike":    { kind: "speed", hide: ["dist"] },
  "Outdoor Run":    { kind: "pace" },
  "Indoor Run":     { kind: "pace" },
  "Openwater Swim": { kind: "swim" },
  "Pool Swim":      { kind: "swim" },
  "Hike":           { kind: "pace" },
  "Walk":           { kind: "pace" },
  "Rest Day":       { kind: "rest", hide: ["min", "dist", "cal", "hr", "hrmax", "note"] },
};
const M_PER = { km: 1000, mi: 1609.344 };
const $ = s => document.querySelector(s), f = $("#f");
const load = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
let items = load("workouts") || []; // deletions stay as {id, upd, del:true} tombstones so they sync
let editing = null;
let unit = load("unit") || "mi";
const save = () => { localStorage.setItem("workouts", JSON.stringify(items)); localStorage.setItem("unit", JSON.stringify(unit)); };
const isSwim = t => TYPES[t].kind === "swim";
const mmss = m => { const s = Math.round(m * 60); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const hm = m => `${Math.floor(m / 60)}h ${Math.round(m % 60)}m`;
const SWIM_U = { "Pool Swim": { m: 1, yd: 0.9144 }, "Openwater Swim": { m: 1, mi: M_PER.mi } }; // metres per unit
const swimU = (type, su) => su in SWIM_U[type] ? su : "m";
const swimF = (type, su) => SWIM_U[type][swimU(type, su)];
const per = w => isSwim(w.type) ? swimF(w.type, w.su) : M_PER[unit];
const dist = w => w.m == null ? "" : isSwim(w.type) ? `${(w.m / per(w)).toFixed(swimU(w.type, w.su) === "mi" ? 2 : 0)} ${swimU(w.type, w.su)}` : `${(w.m / M_PER[unit]).toFixed(2)} ${unit}`;

// Fixed pace units: min/mi for foot travel, min/100yd for swims, mph for bikes (regardless of the distance-unit setting).
function derived(w) {
  if (!w.m || !w.min) return "";
  const k = TYPES[w.type].kind;
  if (k === "speed") return `${(w.m / M_PER.mi / (w.min / 60)).toFixed(1)} mph`;
  if (k === "swim") return `${mmss(w.min / (w.m / 0.9144 / 100))} /100yd`;
  return `${mmss(w.min / (w.m / M_PER.mi))} /mi`;
}

function render() {
  $("#lock").hidden = !!getKey();
  $("#app").hidden = !getKey();
  if (!getKey()) return;
  $("#u").value = unit;
  $("#sul").hidden = !isSwim(f.type.value);
  if (isSwim(f.type.value) && f.su.dataset.t !== f.type.value) {
    f.su.innerHTML = Object.keys(SWIM_U[f.type.value]).map(u => `<option>${u}</option>`).join("");
    f.su.dataset.t = f.type.value;
  }
  const hide = TYPES[f.type.value].hide || [];
  for (const k of ["min", "dist", "cal", "hr", "hrmax", "note"]) {
    f[k].parentElement.hidden = hide.includes(k);
    if (hide.includes(k)) f[k].value = "";
  }
  f.min.required = !hide.includes("min");
  $("#dl").textContent = `Distance (${isSwim(f.type.value) ? swimU(f.type.value, f.su.value) : unit})`;
  const live = items.filter(w => !w.del);
  $("#list").innerHTML = live.sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id).map(w => {
    const bits = TYPES[w.type].kind === "rest" ? [] : [hm(w.min), dist(w), derived(w), w.cal && `${w.cal} kcal`, w.hr && `♥ ${w.hr}${w.hrmax ? "/" + w.hrmax : ""}`].filter(Boolean);
    return `<li><div><b>${w.type}</b> <small>${w.date}</small>${bits.length ? "<br>" + bits.join(" · ") : ""}${w.note ? `<br><small>${esc(w.note)}</small>` : ""}</div>
      <div><button class="del" data-edit="${w.id}" title="Edit" aria-label="Edit">✎</button><button class="del" data-id="${w.id}" title="Delete" aria-label="Delete">✕</button></div></li>`;
  }).join("") || '<li class="mut">No workouts yet.</li>';

  // Weeks start Monday. Avg HR is weighted by duration, over workouts that logged HR.
  const wk = {};
  for (const w of live) {
    const d = new Date(w.date + "T00:00");
    d.setDate(d.getDate() - (d.getDay() + 6) % 7);
    const t = wk[d.toLocaleDateString("en-CA")] ??= { n: 0, min: 0, m: 0, cal: 0, hrMin: 0, hrSum: 0 };
    if (TYPES[w.type].kind !== "rest") t.n++; // rest days don't count as workouts
    t.min += w.min; t.m += w.m || 0; t.cal += w.cal || 0;
    if (w.hr) { t.hrMin += w.min; t.hrSum += w.hr * w.min; }
  }
  $("#weeks").innerHTML = "<tr><th>Week of<th>Workouts<th>Hours<th>Miles<th>Calories<th>Avg HR</tr>" +
    Object.keys(wk).sort().reverse().map(k => {
      const t = wk[k];
      return `<tr><td>${k}<td>${t.n}<td>${(t.min / 60).toFixed(1)}<td>${t.m ? (t.m / M_PER.mi).toFixed(1) : "–"}<td class="${t.cal >= 4000 ? "good" : "bad"}">${t.cal || "–"}<td>${t.hrMin ? Math.round(t.hrSum / t.hrMin) : "–"}</tr>`;
    }).join("");

  const by = {};
  for (const w of live) {
    const t = by[w.type] ??= { n: 0, min: 0, m: 0, cal: 0 };
    t.n++; t.min += w.min; t.m += w.m || 0; t.cal += w.cal || 0;
  }
  $("#tot").innerHTML = Object.entries(by).map(([type, t]) => TYPES[type].kind === "rest" ? `<div><b>${type}</b><br>${t.n}×</div>` :
    `<div><b>${type}</b><br>${t.n}× · ${hm(t.min)}<br>${dist({ type, m: t.m })}${t.cal ? ` · ${t.cal} kcal` : ""}</div>`).join("") || '<span class="mut">—</span>';
}
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

f.type.innerHTML = Object.keys(TYPES).map(t => `<option>${t}</option>`).join("");
f.date.valueAsDate = new Date();
f.type.onchange = f.su.onchange = render;
$("#u").onchange = e => { unit = e.target.value; save(); render(); };

f.onsubmit = e => {
  e.preventDefault();
  const n = k => f[k].value === "" ? undefined : +f[k].value;
  const d = n("dist");
  items = items.filter(w => w.id !== editing);
  items.push({
    id: editing ?? Date.now(), upd: Date.now(), date: f.date.value, type: f.type.value, min: n("min") ?? 0,
    su: isSwim(f.type.value) ? f.su.value : undefined,
    m: d == null ? undefined : d * (isSwim(f.type.value) ? swimF(f.type.value, f.su.value) : M_PER[unit]),
    cal: n("cal"), hr: n("hr"), hrmax: n("hrmax"), note: f.note.value.trim() || undefined,
  });
  save(); sync();
  resetForm();
};

function resetForm() {
  editing = null;
  for (const k of ["min", "dist", "cal", "hr", "hrmax", "note"]) f[k].value = "";
  $("#sub").textContent = "Add workout"; $("#cancel").hidden = true;
  render();
}
$("#cancel").onclick = resetForm;

$("#list").onclick = e => {
  const { id, edit } = e.target.dataset;
  if (edit) {
    const w = items.find(w => w.id == edit);
    editing = w.id;
    f.date.value = w.date; f.type.value = w.type; f.min.value = w.min;
    render();
    f.su.value = w.su || "m";
    f.dist.value = w.m == null ? "" : +(w.m / per(w)).toFixed(3);
    f.cal.value = w.cal ?? ""; f.hr.value = w.hr ?? ""; f.hrmax.value = w.hrmax ?? ""; f.note.value = w.note ?? "";
    $("#sub").textContent = "Save changes"; $("#cancel").hidden = false;
    render(); f.scrollIntoView();
  } else if (id && confirm("Delete this workout?")) {
    items = items.map(w => w.id == id ? { id: w.id, upd: Date.now(), del: true } : w);
    save(); sync(); render();
  }
};

// Sync: each device with the same password shares one document on the MattTrips sync Worker (a key-value
// store of records, newest `updatedAt` wins). The key is a hash of the password, so there is no login.
const SYNC_URL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? "http://127.0.0.1:8787/s/" : "https://matttrips-sync.matttrips-sync.workers.dev/s/";
const merge = remote => {
  const m = new Map(items.map(w => [w.id, w]));
  for (const r of remote) if (!m.has(r.id) || (r.upd || 0) > (m.get(r.id).upd || 0)) m.set(r.id, r);
  items = [...m.values()];
};
const getKey = () => { try { return localStorage.getItem("wl:key"); } catch { return null; } };
let queue = Promise.resolve();
const sync = () => queue = queue.then(doSync);
async function doSync() {
  const key = getKey();
  if (!key) return;
  try {
    const doc = { trips: Object.fromEntries(items.map(w => [w.id, { ...w, updatedAt: w.upd || 0 }])) };
    const res = await fetch(SYNC_URL + key, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(doc) });
    if (!res.ok) throw new Error(res.status);
    merge(Object.values((await res.json()).trips)); // keeps edits made while the request was out
    save(); render(); $("#lockBtn").textContent = "Lock";
  } catch { $("#lockBtn").textContent = "Lock ⚠"; } // offline: the next change, launch, or 'online' event retries
}
$("#lock").onsubmit = async e => {
  e.preventDefault();
  const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("workoutlog-sync:" + $("#pw").value));
  localStorage.setItem("wl:key", btoa(String.fromCharCode(...new Uint8Array(h))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""));
  $("#pw").value = ""; render(); sync();
};
$("#lockBtn").onclick = () => { localStorage.removeItem("wl:key"); localStorage.removeItem("workouts"); items = []; render(); };
document.onvisibilitychange = () => document.visibilityState === "visible" && sync();
addEventListener("online", sync);

render();
sync();
</script>
</body>
</html>
